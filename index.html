<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Terminal Deck</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131a29;
      --card-hover: #1c263b;
      --yellow-primary: #fbbf24;
      --yellow-glow: rgba(251, 191, 36, 0.25);
      --yellow-subtle: rgba(251, 191, 36, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-yellow: rgba(251, 191, 36, 0.3);
      --live-green: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 18px;
      line-height: 1.4;
    }

    ::-webkit-scrollbar { width: 6px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #26334d; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--yellow-primary); }

    header {
      background: rgba(19, 26, 41, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-yellow);
      border-radius: 20px;
      padding: 16px 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 span {
      color: var(--yellow-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      background: var(--yellow-subtle);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-yellow);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--yellow-primary);
      background: var(--yellow-subtle);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-yellow);
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: var(--live-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--live-green);
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-family: inherit;
      transition: all 0.25s ease;
    }

    input {
      flex: 1;
      min-width: 180px;
    }

    input:focus {
      outline: none;
      border-color: var(--yellow-primary);
      box-shadow: 0 0 12px var(--yellow-glow);
    }

    button {
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: var(--yellow-primary);
      color: #000;
      border-color: var(--yellow-primary);
      box-shadow: 0 0 12px var(--yellow-glow);
    }

    .btn-alert {
      border-color: var(--yellow-primary);
      color: var(--yellow-primary);
      background: var(--yellow-subtle);
    }

    .btn-reset {
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }
    .btn-reset:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 16px;
    }

    .column {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      max-height: 82vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .column-title {
      font-size: 0.88rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
      color: var(--yellow-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-yellow);
    }

    .remove-btn {
      color: var(--text-muted);
      background: none;
      border: none;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 1rem;
      border-radius: 50%;
    }
    .remove-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

    .news-card {
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .news-card:hover {
      background: var(--card-hover);
      border-color: var(--yellow-primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3), 0 0 10px var(--yellow-subtle);
    }

    .news-card a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      line-height: 1.4;
      display: block;
    }

    .news-card a:hover { color: var(--yellow-primary); }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
    }

    .source-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .source-tag img { border-radius: 4px; }

    .modal {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-yellow);
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>FINANCIAL TERMINAL <span>PRO</span></h1>
      <div class="status-badge">
        <div class="pulse"></div>
        <span id="lastUpdated">CONNECTING...</span>
      </div>
    </div>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search headlines (Fed, Rate, AAPL)..." onkeyup="filterNews()">
      <input type="text" id="alertKeywords" placeholder="Alert keywords (e.g. Fed, Rate, Earnings)..." onchange="saveAlertKeywords()">
      <button class="btn-alert" onclick="enableNotifications()">🔔 Alerts</button>
      <button onclick="toggleModal('addModal')">➕ Add Feed</button>
      <button class="btn-reset" onclick="resetToDefaults()">🧹 Reset</button>
      <button onclick="fetchFeeds()">🔄 Refresh</button>
    </div>
  </header>

  <!-- Modal for custom RSS sources -->
  <div class="modal" id="addModal">
    <h3 style="margin-top:0; font-size:1rem; color:var(--yellow-primary);">Add Custom RSS Source</h3>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <input type="text" id="newCategory" placeholder="Category Name (e.g. Crypto)">
      <input type="text" id="newUrl" placeholder="RSS Feed URL (https://...)">
      <button onclick="addSource()">Save Source</button>
    </div>
  </div>

  <div class="deck-grid" id="deckGrid"></div>

  <script>
    // 100% Open & Unblocked Major Global Sources
    const defaultSources = [
      { category: "Reuters Business", url: "https://news.google.com/rss/search?q=when:24h+allinurl:reuters.com/business&hl=en-US&gl=US&ceid=US:en" },
      { category: "Financial Times", url: "https://news.google.com/rss/search?q=when:24h+site:ft.com&hl=en-US&gl=US&ceid=US:en" },
      { category: "MarketWatch", url: "https://news.google.com/rss/search?q=when:24h+site:marketwatch.com&hl=en-US&gl=US&ceid=US:en" },
      { category: "CNBC Markets", url: "https://www.cnbc.com/id/100003114/device/rss/rss.html" },
      { category: "Wall Street Journal", url: "https://feeds.a.dj.com/rss/WSJcomUSBusiness.xml" },
      { category: "NY Times Business", url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml" },
      { category: "TechCrunch", url: "https://techcrunch.com/feed/" },
      { category: "BBC World Business", url: "http://newsrss.bbc.co.uk/rss/newsonline_uk_edition/business/rss.xml" }
    ];

    const seenItems = new Set();

    function getSources() {
      const saved = localStorage.getItem('deck_sources_v16');
      return saved ? JSON.parse(saved) : defaultSources;
    }

    function saveSources(sources) {
      localStorage.setItem('deck_sources_v16', JSON.stringify(sources));
    }

    function resetToDefaults() {
      if (confirm("Reset all feeds back to default major channels?")) {
        localStorage.removeItem('deck_sources_v16');
        fetchFeeds();
      }
    }

    function saveAlertKeywords() {
      localStorage.setItem('deck_alerts_v16', document.getElementById('alertKeywords').value);
    }

    function loadAlertKeywords() {
      const saved = localStorage.getItem('deck_alerts_v16');
      if (saved) document.getElementById('alertKeywords').value = saved;
    }

    function toggleModal(id) {
      const el = document.getElementById(id);
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function addSource() {
      const category = document.getElementById('newCategory').value.trim();
      const url = document.getElementById('newUrl').value.trim();
      if (!category || !url) return alert('Please enter both a category name and RSS URL.');

      const sources = getSources();
      sources.push({ category, url });
      saveSources(sources);

      document.getElementById('newCategory').value = '';
      document.getElementById('newUrl').value = '';
      toggleModal('addModal');
      fetchFeeds();
    }

    function removeSource(index) {
      const sources = getSources();
      sources.splice(index, 1);
      saveSources(sources);
      fetchFeeds();
    }

    function enableNotifications() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            alert("Desktop alerts enabled!");
          }
        });
      } else {
        alert("This browser does not support web notifications.");
      }
    }

    function checkAlerts(items) {
      const alertInput = document.getElementById('alertKeywords').value;
      if (!alertInput || Notification.permission !== "granted") return;

      const keywords = alertInput.toLowerCase().split(',').map(k => k.trim()).filter(Boolean);
      if (keywords.length === 0) return;

      items.forEach(item => {
        const titleLower = item.title.toLowerCase();
        const itemKey = item.guid || item.link;

        if (!seenItems.has(itemKey)) {
          seenItems.add(itemKey);
          const matched = keywords.find(kw => titleLower.includes(kw));
          if (matched) {
            new Notification(`🚨 Priority Alert: ${matched.toUpperCase()}`, {
              body: item.title,
              icon: "https://fav.farm/📈"
            });
          }
        }
      });
    }

    async function loadFeed(url) {
      try {
        const res = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`);
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");
        const items = Array.from(xml.querySelectorAll("item, entry")).slice(0, 15);

        if (items.length > 0) {
          return items.map(el => {
            let title = el.querySelector("title") ? el.querySelector("title").textContent : "No Title";
            let link = "#";
            const linkEl = el.querySelector("link");
            if (linkEl) {
              link = linkEl.getAttribute("href") || linkEl.textContent || "#";
            }
            const pubDate = el.querySelector("pubDate, updated") ? el.querySelector("pubDate, updated").textContent : "";
            
            // Clean up titles from Google syndication tags
            if (title.includes(" - ")) {
              title = title.split(" - ")[0];
            }
            return { title, link, pubDate, author: "" };
          });
        }
      } catch (e) {}

      try {
        const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url));
        const data = await res.json();
        if (data.status === 'ok' && data.items && data.items.length > 0) {
          return data.items;
        }
      } catch (e) {}

      return [];
    }

    async function fetchFeeds() {
      const grid = document.getElementById('deckGrid');
      
      const sources = getSources();
      let html = '';

      for (let i = 0; i < sources.length; i++) {
        const source = sources[i];
        const items = await loadFeed(source.url);
        
        checkAlerts(items);

        html += `
          <div class="column">
            <div class="column-title">
              <span>${source.category}</span>
              <button class="remove-btn" onclick="removeSource(${i})" title="Remove Source">✕</button>
            </div>
            <div class="news-list">
        `;

        if (items.length === 0) {
          html += `<p style="font-size:0.8rem; color:var(--text-muted); padding: 8px 0;">No items available or feed updating...</p>`;
        }

        items.forEach(item => {
          const pubDate = item.pubDate ? new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
          
          let domain = "news";
          try { domain = new URL(item.link).hostname.replace('www.', ''); } catch(e){}
          const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;

          html += `
            <div class="news-card">
              <a href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
              <div class="meta">
                <span class="source-tag">
                  <img src="${iconUrl}" width="14" height="14" alt="logo" onerror="this.style.display='none'">
                  ${item.author || domain}
                </span>
                <span>${pubDate}</span>
              </div>
            </div>
          `;
        });

        html += `</div></div>`;
      }

      grid.innerHTML = html;
      document.getElementById('lastUpdated').innerText = 'LIVE • ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      filterNews();
    }

    function filterNews() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.news-card').forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(input) ? 'block' : 'none';
      });
    }

    // Initialize
    loadAlertKeywords();
    fetchFeeds();

    // Auto-refresh every 60 seconds
    setInterval(fetchFeeds, 60000);
  </script>
</body>
</html>
