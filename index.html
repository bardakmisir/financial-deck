<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Terminal Deck</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131a29;
      --yellow-primary: #fbbf24;
      --border-yellow: rgba(251, 191, 36, 0.3);
      --border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 12px;
      line-height: 1.4;
    }

    header {
      background: rgba(19, 26, 41, 0.85);
      border: 1px solid var(--border-yellow);
      border-radius: 16px;
      padding: 12px 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 span {
      color: var(--yellow-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      background: rgba(251, 191, 36, 0.1);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid var(--border-yellow);
    }

    /* Ticker Bar Container */
    .ticker-wrapper {
      margin-bottom: 12px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-yellow);
      background: var(--card-bg);
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
    }

    .news-column {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 12px;
      height: 650px;
      display: flex;
      flex-direction: column;
    }

    .column-header {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--yellow-primary);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-yellow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
      background: #ffffff;
    }

    .dark-iframe {
      filter: invert(0.92) hue-rotate(180deg); /* Smart dark mode filter for standard feeds */
    }
  </style>
</head>
<body>

  <header>
    <h1>FINANCIAL TERMINAL <span>LIVE DESK</span></h1>
  </header>

  <!-- Live Spot Ticker (BTC, Gold, Silver, EUR/USD, GBP/USD) -->
  <div class="ticker-wrapper">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "BITSTAMP:BTCUSD", "title": "BTC/USD" },
          { "proName": "TVC:GOLD", "title": "Gold" },
          { "proName": "TVC:SILVER", "title": "Silver" },
          { "proName": "FX_IDC:EURUSD", "title": "EUR/USD" },
          { "proName": "FX_IDC:GBPUSD", "title": "GBP/USD" }
        ],
        "showSymbolLogo": true,
        "isTransparent": true,
        "displayMode": "adaptive",
        "colorTheme": "dark",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <!-- News Grid -->
  <div class="deck-grid">

    <!-- Column 1: Live MarketWatch & Breaking News Feed -->
    <div class="news-column">
      <div class="column-header">MarketWatch Breaking News</div>
      <iframe class="dark-iframe" src="https://www.rssdog.com/index.htm?url=https%3A%2F%2Ffeeds.content.dowjones.io%2Fpublic%2Frss%2Fmw_topstories&mode=html&showtime=1&utf8=1"></iframe>
    </div>

    <!-- Column 2: CNBC Top Business Headlines -->
    <div class="news-column">
      <div class="column-header">CNBC World Business</div>
      <iframe class="dark-iframe" src="https://www.rssdog.com/index.htm?url=https%3A%2F%2Fwww.cnbc.com%2Fid%2F100003114%2Fdevice%2Frss%2Frss.html&mode=html&showtime=1&utf8=1"></iframe>
    </div>

    <!-- Column 3: BBC Global Macro News -->
    <div class="news-column">
      <div class="column-header">BBC World Business</div>
      <iframe class="dark-iframe" src="https://www.rssdog.com/index.htm?url=http%3A%2F%2Fnewsrss.bbc.co.uk%2Frss%2Fnewsonline_uk_edition%2Fbusiness%2Frss.xml&mode=html&showtime=1&utf8=1"></iframe>
    </div>

  </div>

</body>
</html>
