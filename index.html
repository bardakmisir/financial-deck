<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal News & Market Deck</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131a29;
      --yellow-primary: #fbbf24;
      --border-yellow: rgba(251, 191, 36, 0.3);
      --border: #1e293b;
      --text-main: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 12px;
      line-height: 1.4;
    }

    header {
      background: rgba(19, 26, 41, 0.85);
      border: 1px solid var(--border-yellow);
      border-radius: 16px;
      padding: 12px 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 span {
      color: var(--yellow-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      background: rgba(251, 191, 36, 0.1);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid var(--border-yellow);
    }

    .ticker-wrapper {
      margin-bottom: 12px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-yellow);
      background: var(--card-bg);
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 12px;
    }

    .widget-container {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 8px;
      height: 600px;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <header>
    <h1>FINANCIAL TERMINAL <span>LIVE DESK</span></h1>
  </header>

  <!-- Live Market Ticker Bar (BTC, Gold, Silver, EUR/USD, GBP/USD) -->
  <div class="ticker-wrapper">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "BITSTAMP:BTCUSD", "title": "BTC/USD" },
          { "proName": "TVC:GOLD", "title": "Gold" },
          { "proName": "TVC:SILVER", "title": "Silver" },
          { "proName": "FX_IDC:EURUSD", "title": "EUR/USD" },
          { "proName": "FX_IDC:GBPUSD", "title": "GBP/USD" }
        ],
        "showSymbolLogo": true,
        "isTransparent": true,
        "displayMode": "adaptive",
        "colorTheme": "dark",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <!-- Main Grid Layout -->
  <div class="deck-grid">

    <!-- Column 1: Live Real-Time Financial News Stream -->
    <div class="widget-container">
      <div class="tradingview-widget-container" style="height:100%; width:100%;">
        <div class="tradingview-widget-container__widget" style="height:100%; width:100%;"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
        {
          "feedMode": "all_symbols",
          "isTransparent": true,
          "displayMode": "regular",
          "width": "100%",
          "height": "100%",
          "colorTheme": "dark",
          "locale": "en"
        }
        </script>
      </div>
    </div>

    <!-- Column 2: Live Market Overview (Indexes, Metals, Crypto) -->
    <div class="widget-container">
      <div class="tradingview-widget-container" style="height:100%; width:100%;">
        <div class="tradingview-widget-container__widget" style="height:100%; width:100%;"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
        {
          "colorTheme": "dark",
          "dateRange": "1D",
          "showChart": true,
          "locale": "en",
          "width": "100%",
          "height": "100%",
          "largeChartUrl": "",
          "isTransparent": true,
          "showSymbolLogo": true,
          "showFloatingTooltip": false,
          "tabs": [
            {
              "title": "Commodities & Forex",
              "symbols": [
                { "s": "TVC:GOLD", "d": "Gold" },
                { "s": "TVC:SILVER", "d": "Silver" },
                { "s": "FX_IDC:EURUSD", "d": "EUR/USD" },
                { "s": "FX_IDC:GBPUSD", "d": "GBP/USD" }
              ]
            },
            {
              "title": "Crypto",
              "symbols": [
                { "s": "BITSTAMP:BTCUSD", "d": "Bitcoin" },
                { "s": "BITSTAMP:ETHUSD", "d": "Ethereum" }
              ]
            }
          ]
        }
        </script>
      </div>
    </div>

  </div>

</body>
</html>
