<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal News Deck</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-hover: #1f293d;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #1e293b;
      --live-green: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      line-height: 1.4;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

    header {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 span {
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      background: rgba(6, 182, 212, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: var(--live-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--live-green);
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      transition: all 0.2s ease;
    }

    input {
      flex: 1;
      min-width: 180px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.2);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: var(--card-bg);
      border-color: var(--text-muted);
    }

    .btn-alert {
      border-color: rgba(245, 158, 11, 0.4);
      color: var(--accent-amber);
    }
    .btn-alert:hover {
      background: rgba(245, 158, 11, 0.1);
      border-color: var(--accent-amber);
    }

    .btn-reset {
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }
    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .column {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 14px;
      border: 1px solid var(--border);
      max-height: 83vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .column-title {
      font-size: 0.88rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      color: var(--accent-cyan);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .remove-btn {
      color: var(--text-muted);
      background: none;
      border: none;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .remove-btn:hover { color: #ef4444; }

    .news-card {
      background: rgba(9, 13, 22, 0.5);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      transition: all 0.15s ease-in-out;
    }

    .news-card:hover {
      background: var(--card-hover);
      border-color: rgba(6, 182, 212, 0.4);
      transform: translateY(-1px);
    }

    .news-card a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.85rem;
      line-height: 1.35;
      display: block;
    }

    .news-card a:hover { color: var(--accent-cyan); }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    .source-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .source-tag img { border-radius: 2px; }

    .modal {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>FINANCIAL TERMINAL <span>PRO v1.0</span></h1>
      <div class="status-badge">
        <div class="pulse"></div>
        <span id="lastUpdated">CONNECTING...</span>
      </div>
    </div>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search headlines (Fed, Rate, AAPL)..." onkeyup="filterNews()">
      <input type="text" id="alertKeywords" placeholder="Alert keywords (e.g. Fed, Rate, Earnings)..." onchange="saveAlertKeywords()">
      <button class="btn-alert" onclick="enableNotifications()">🔔 Alerts</button>
      <button onclick="toggleModal('addModal')">➕ Add Feed</button>
      <button class="btn-reset" onclick="resetToDefaults()">🧹 Reset</button>
      <button onclick="fetchFeeds()">🔄 Refresh</button>
    </div>
  </header>

  <!-- Modal for custom RSS sources -->
  <div class="modal" id="addModal">
    <h3 style="margin-top:0; font-size:0.95rem; color:var(--accent-cyan);">Add Custom RSS Source</h3>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <input type="text" id="newCategory" placeholder="Category Name (e.g. Crypto)">
      <input type="text" id="newUrl" placeholder="RSS Feed URL (https://...)">
      <button onclick="addSource()">Save Source</button>
    </div>
  </div>

  <div class="deck-grid" id="deckGrid"></div>

  <script>
    const defaultSources = [
      { category: "CNBC Markets", url: "https://www.cnbc.com/id/100003114/device/rss/rss.html" },
      { category: "NYT Business", url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml" },
      { category: "Wall Street Journal", url: "https://feeds.a.dj.com/rss/WSJcomUSBusiness.xml" },
      { category: "Economy & Jobs", url: "https://www.cnbc.com/id/20910258/device/rss/rss.html" },
      { category: "TechCrunch", url: "https://techcrunch.com/feed/" },
      { category: "Yahoo Finance", url: "https://finance.yahoo.com/news/rssindex" }
    ];

    const seenItems = new Set();

    function getSources() {
      const saved = localStorage.getItem('deck_sources_v11');
      return saved ? JSON.parse(saved) : defaultSources;
    }

    function saveSources(sources) {
      localStorage.setItem('deck_sources_v11', JSON.stringify(sources));
    }

    function resetToDefaults() {
      if (confirm("Reset all feeds back to the default sources?")) {
        localStorage.removeItem('deck_sources_v11');
        fetchFeeds();
      }
    }

    function saveAlertKeywords() {
      localStorage.setItem('deck_alerts_v11', document.getElementById('alertKeywords').value);
    }

    function loadAlertKeywords() {
      const saved = localStorage.getItem('deck_alerts_v11');
      if (saved) document.getElementById('alertKeywords').value = saved;
    }

    function toggleModal(id) {
      const el = document.getElementById(id);
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function addSource() {
      const category = document.getElementById('newCategory').value.trim();
      const url = document.getElementById('newUrl').value.trim();
      if (!category || !url) return alert('Please enter both a category name and RSS URL.');

      const sources = getSources();
      sources.push({ category, url });
      saveSources(sources);

      document.getElementById('newCategory').value = '';
      document.getElementById('newUrl').value = '';
      toggleModal('addModal');
      fetchFeeds();
    }

    function removeSource(index) {
      const sources = getSources();
      sources.splice(index, 1);
      saveSources(sources);
      fetchFeeds();
    }

    function enableNotifications() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            alert("Desktop alerts enabled!");
          }
        });
      } else {
        alert("This browser does not support web notifications.");
      }
    }

    function checkAlerts(items) {
      const alertInput = document.getElementById('alertKeywords').value;
      if (!alertInput || Notification.permission !== "granted") return;

      const keywords = alertInput.toLowerCase().split(',').map(k => k.trim()).filter(Boolean);
      if (keywords.length === 0) return;

      items.forEach(item => {
        const titleLower = item.title.toLowerCase();
        const itemKey = item.guid || item.link;

        if (!seenItems.has(itemKey)) {
          seenItems.add(itemKey);
          const matched = keywords.find(kw => titleLower.includes(kw));
          if (matched) {
            new Notification(`🚨 Priority Alert: ${matched.toUpperCase()}`, {
              body: item.title,
              icon: "https://fav.farm/📈"
            });
          }
        }
      });
    }

    async function loadFeed(url) {
      try {
        const res = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`);
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");
        const items = Array.from(xml.querySelectorAll("item, entry")).slice(0, 15);

        if (items.length > 0) {
          return items.map(el => {
            const title = el.querySelector("title") ? el.querySelector("title").textContent : "No Title";
            let link = "#";
            const linkEl = el.querySelector("link");
            if (linkEl) {
              link = linkEl.getAttribute("href") || linkEl.textContent || "#";
            }
            const pubDate = el.querySelector("pubDate, updated") ? el.querySelector("pubDate, updated").textContent : "";
            return { title, link, pubDate, author: "" };
          });
        }
      } catch (e) {}

      try {
        const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url));
        const data = await res.json();
        if (data.status === 'ok' && data.items && data.items.length > 0) {
          return data.items;
        }
      } catch (e) {}

      return [];
    }

    async function fetchFeeds() {
      const grid = document.getElementById('deckGrid');
      
      const sources = getSources();
      let html = '';

      for (let i = 0; i < sources.length; i++) {
        const source = sources[i];
        const items = await loadFeed(source.url);
        
        checkAlerts(items);

        html += `
          <div class="column">
            <div class="column-title">
              <span>${source.category}</span>
              <button class="remove-btn" onclick="removeSource(${i})" title="Remove Source">✕</button>
            </div>
            <div class="news-list">
        `;

        if (items.length === 0) {
          html += `<p style="font-size:0.8rem; color:var(--text-muted); padding: 8px 0;">No items available or feed offline.</p>`;
        }

        items.forEach(item => {
          const pubDate = item.pubDate ? new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
          
          let domain = "news";
          try { domain = new URL(item.link).hostname.replace('www.', ''); } catch(e){}
          const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;

          html += `
            <div class="news-card">
              <a href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
              <div class="meta">
                <span class="source-tag">
                  <img src="${iconUrl}" width="13" height="13" alt="logo" onerror="this.style.display='none'">
                  ${item.author || domain}
                </span>
                <span>${pubDate}</span>
              </div>
            </div>
          `;
        });

        html += `</div></div>`;
      }

      grid.innerHTML = html;
      document.getElementById('lastUpdated').innerText = 'LIVE • ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      filterNews();
    }

    function filterNews() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.news-card').forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(input) ? 'block' : 'none';
      });
    }

    // Initialize
    loadAlertKeywords();
    fetchFeeds();

    // Auto-refresh every 60 seconds
    setInterval(fetchFeeds, 60000);
  </script>
</body>
</html>
